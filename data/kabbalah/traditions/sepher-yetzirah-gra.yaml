tradition:
  name: "Sepher Yetzirah Gra"
  domain: kabbalah
  description: >
    The threefold Hebrew letter scheme described in the Gra recension of the
    Sepher Yetzirah ("Book of Formation"): the 3 Mother letters assigned to
    the elements, the 7 Double letters assigned to the planets (each also
    carrying a positive/negative "foundation"/"transpose" pair), and the 12
    Simple letters assigned to the zodiac signs (each carrying a single
    "foundation" — a human faculty or sense).
