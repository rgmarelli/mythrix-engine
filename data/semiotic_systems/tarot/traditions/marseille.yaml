tradition:
  name: "Marseille"
  domain: tarot
  description: >
    The historical, unattributed woodblock pattern of French/Italian origin
    standardized by 18th-century Marseille card makers (notably Nicolas
    Conver's 1760 deck), predating and iconographically distinct from the
    Rider-Waite-Smith deck's added scenery and reordered trumps.
