semiotic_system: tarot
sign:
  name: The Emperor
  type: major-arcana
  manifestations:
  - tradition: rider-waite
    display_name: The Emperor
    denotation: A crowned monarch sits commandingly on a throne whose arms are fronted by rams' heads.
      He holds a form of the Crux ansata as a sceptre in one hand and a globe in the other, embodying
      executive power and the realization of worldly rule.
    properties:
    - key: number
      value: '4'
    interpretants:
    - type: concept
      value: rams'-head throne
    - type: concept
      value: ankh sceptre
    - type: concept
      value: globe
    - type: concept
      value: crown
    cites: 'Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, IV. The Emperor'
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Daleth
      relationship: hebrew_letter
      according_to: marelli
  - tradition: marseille
    display_name: L'Empereur
    denotation: A bearded man sits in profile, holding a sceptre in his right hand. He wears a helmet
      with twelve points and is seated upon a cubic stone bearing the figure of an eagle, his legs crossed
      so his body forms a triangle.
    properties:
    - key: number
      value: '4'
    interpretants:
    - type: concept
      value: sceptre
    - type: concept
      value: helmet
    - type: concept
      value: cubic stone
    - type: concept
      value: eagle
    - type: concept
      value: crossed legs
    - type: concept
      value: profile
    cites: Papus, Le Tarot des Bohémiens, The Emperor
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Daleth
      relationship: hebrew_letter
      according_to: marelli
