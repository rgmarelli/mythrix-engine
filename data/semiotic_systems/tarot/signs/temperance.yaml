semiotic_system: tarot
sign:
  name: Temperance
  type: major-arcana
  manifestations:
  - tradition: rider-waite
    display_name: Temperance
    denotation: A winged angel, bearing the sign of the sun on its forehead and the square and triangle
      of the septenary on its breast, pours the essences of life from one chalice to another. One foot
      rests on the earth and the other upon water, and a path climbs toward distant heights where a crown
      glimmers in a great light.
    properties:
    - key: number
      value: '14'
    interpretants:
    - type: concept
      value: winged angel
    - type: concept
      value: two chalices
    - type: concept
      value: one foot on water
    - type: concept
      value: distant crown
    cites: 'Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, XIV. Temperance'
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Nun
      relationship: hebrew_letter
      according_to: marelli
  - tradition: marseille
    display_name: Tempérance
    denotation: The genius of the Sun pours the fluid of Life from a golden vase into a silver one, the
      essence passing from one vase to the other without a single drop being spilt.
    properties:
    - key: number
      value: '14'
    interpretants:
    - type: concept
      value: golden vase
    - type: concept
      value: silver vase
    - type: concept
      value: pouring
    cites: Papus, Le Tarot des Bohémiens, Temperance
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Nun
      relationship: hebrew_letter
      according_to: marelli
