semiotic_system: tarot
sign:
  name: The Moon
  type: major-arcana
  manifestations:
  - tradition: rider-waite
    display_name: The Moon
    denotation: A moon with sixteen chief and sixteen secondary rays shines over a path that runs between
      two towers and on toward the unknown. A dog and a wolf howl below it, and a crustacean crawls up
      from the water toward the land — the fears of the natural mind guided only by reflected light.
    properties:
    - key: number
      value: '18'
    interpretants:
    - type: concept
      value: moon
    - type: concept
      value: two towers
    - type: concept
      value: dog
    - type: concept
      value: wolf
    - type: concept
      value: crustacean
    - type: concept
      value: water
    - type: concept
      value: winding path
    cites: 'Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, XVIII. The Moon'
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Tzadi
      relationship: hebrew_letter
      according_to: marelli
  - tradition: marseille
    display_name: La Lune
    denotation: A meadow, feebly lit by the moon, is bounded by a tower on each side; drops of blood fall
      from the moon along a path that loses itself in the horizon. In the centre of the field a dog and
      a wolf howl at the moon, while a crayfish climbs out of the water between them.
    properties:
    - key: number
      value: '18'
    interpretants:
    - type: concept
      value: moon
    - type: concept
      value: towers
    - type: concept
      value: dog
    - type: concept
      value: wolf
    - type: concept
      value: crayfish
    - type: concept
      value: blood
    cites: Papus, Le Tarot des Bohémiens, The Moon
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Tzadi
      relationship: hebrew_letter
      according_to: marelli
