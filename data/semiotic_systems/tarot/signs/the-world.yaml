semiotic_system: tarot
sign:
  name: The World
  type: major-arcana
  manifestations:
  - tradition: rider-waite
    display_name: The World
    denotation: A dancing female figure, lightly draped in a scarf and holding a wand in each hand, stands
      within a great elliptic garland of flowers. The four Living Creatures of Ezekiel's vision, attributed
      to the evangelists, are grouped about the garland's corners — the perfection and end of the Cosmos.
    properties:
    - key: number
      value: '21'
    interpretants:
    - type: concept
      value: dancing figure
    - type: concept
      value: oval garland
    - type: concept
      value: two wands
    - type: concept
      value: four living creatures
    cites: 'Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, XXI. The World'
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Shin
      relationship: hebrew_letter
      according_to: marelli
  - tradition: marseille
    display_name: Le Monde
    denotation: 'A nude female figure, holding a wand in each hand, stands at the centre of an ellipse,
      her legs crossed like those of the Hanged Man. At the four corners of the card appear the four animals
      of the Apocalypse and the four forms of the Sphinx: the Man, the Lion, the Bull, and the Eagle.'
    properties:
    - key: number
      value: '21'
    interpretants:
    - type: concept
      value: ellipse
    - type: concept
      value: wands
    - type: concept
      value: crossed legs
    - type: concept
      value: four living creatures
    cites: Papus, Le Tarot des Bohémiens, The World
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Shin
      relationship: hebrew_letter
      according_to: marelli
