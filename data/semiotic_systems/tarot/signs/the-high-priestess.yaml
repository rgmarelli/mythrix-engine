semiotic_system: tarot
sign:
  name: The High Priestess
  type: major-arcana
  manifestations:
  - tradition: rider-waite
    display_name: The High Priestess
    denotation: A seated woman is enthroned between a black pillar marked B and a white pillar marked
      J, a veil embroidered with palms and pomegranates hanging behind her. A lunar crescent rests at
      her feet, a horned diadem with a globe crowns her head, and a solar cross lies on her breast. She
      holds a partly-veiled scroll inscribed TORA.
    properties:
    - key: number
      value: '2'
    interpretants:
    - type: concept
      value: black and white pillars
    - type: concept
      value: veiled scroll
    - type: concept
      value: lunar crescent
    - type: concept
      value: horned diadem
    cites: 'Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, II. The High Priestess'
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Bet
      relationship: hebrew_letter
      according_to: marelli
  - tradition: marseille
    display_name: La Papesse
    denotation: A seated woman is placed under the porch of the temple of Isis, between two columns. She
      wears a tiara surmounted by the lunar crescent and is enveloped in a transparent veil falling over
      her face. The solar cross lies on her breast, and an open book, half covered by her mantle, rests
      upon her knees.
    properties:
    - key: number
      value: '2'
    interpretants:
    - type: concept
      value: tiara
    - type: concept
      value: lunar crescent
    - type: concept
      value: veil
    - type: concept
      value: solar cross
    - type: concept
      value: open book
    - type: concept
      value: columns
    cites: Papus, Le Tarot des Bohémiens, The High Priestess
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Bet
      relationship: hebrew_letter
      according_to: marelli
