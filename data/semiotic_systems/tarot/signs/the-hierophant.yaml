semiotic_system: tarot
sign:
  name: The Hierophant
  type: major-arcana
  manifestations:
  - tradition: rider-waite
    display_name: The Hierophant
    denotation: A figure wearing the triple crown sits enthroned between two pillars, holding a sceptre
      terminating in a triple cross in his left hand while his right hand gives an ecclesiastical sign
      distinguishing the manifest from the concealed part of doctrine. Crossed keys lie at his feet, and
      two priestly ministers kneel before him.
    properties:
    - key: number
      value: '5'
    interpretants:
    - type: concept
      value: triple crown
    - type: concept
      value: triple cross sceptre
    - type: concept
      value: crossed keys
    - type: concept
      value: kneeling ministers
    cites: 'Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, V. The Hierophant'
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: He
      relationship: hebrew_letter
      according_to: marelli
  - tradition: marseille
    display_name: Le Pape
    denotation: The Initiate is seated between the two columns of the sanctuary, leaning upon a triple
      cross and making the sign of esoterism with his left hand. He wears a tiara, and two crowned men,
      one clothed in red and the other in black, kneel at his feet.
    properties:
    - key: number
      value: '5'
    interpretants:
    - type: concept
      value: tiara
    - type: concept
      value: triple cross
    - type: concept
      value: columns
    - type: concept
      value: kneeling
    - type: concept
      value: esoterism sign
    cites: Papus, Le Tarot des Bohémiens, The Pope
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: He
      relationship: hebrew_letter
      according_to: marelli
