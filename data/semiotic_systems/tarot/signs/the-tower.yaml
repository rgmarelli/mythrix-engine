semiotic_system: tarot
sign:
  name: The Tower
  type: major-arcana
  manifestations:
  - tradition: rider-waite
    display_name: The Tower
    denotation: A tall gray tower stands atop a rocky mountain peak, its crenellated crown struck by a
      jagged bolt of lightning against a dark sky. Flames burst from two windows near the top. The lightning
      has knocked the tower's crown loose, and it tumbles through the air alongside two human figures
      falling headfirst toward the rocks below. Rays resembling Hebrew yods fall from the clouds on either
      side of the tower.
    properties:
    - key: number
      value: '16'
    interpretants:
    - type: concept
      value: lightning
    - type: concept
      value: crown
    - type: concept
      value: flames
    - type: concept
      value: falling figures
    cites: 'Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, XVI. The Tower'
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Ayin
      relationship: hebrew_letter
      according_to: marelli
  - tradition: marseille
    display_name: La Maison Dieu
    denotation: A tower has its battlements struck by lightning; two men, one crowned and the other uncrowned,
      fall with the fragments of broken masonry.
    properties:
    - key: number
      value: '16'
    interpretants:
    - type: concept
      value: tower
    - type: concept
      value: lightning
    - type: concept
      value: battlements
    - type: concept
      value: falling figures
    cites: Papus, Le Tarot des Bohémiens, The Lightning-struck Tower
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Ayin
      relationship: hebrew_letter
      according_to: marelli
