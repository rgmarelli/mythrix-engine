semiotic_system: tarot
sign:
  name: The Hanged Man
  type: major-arcana
  manifestations:
  - tradition: rider-waite
    display_name: The Hanged Man
    denotation: A figure hangs suspended by one foot from a gallows of living wood that forms a Tau cross,
      his legs crossed to form a fylfot cross and a nimbus about his head. His face expresses deep entrancement
      rather than suffering — life in suspension, but life and not death.
    properties:
    - key: number
      value: '12'
    interpretants:
    - type: concept
      value: Tau cross
    - type: concept
      value: inverted figure
    - type: concept
      value: nimbus
    - type: concept
      value: entranced expression
    cites: 'Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, XII. The Hanged
      Man'
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Lamed
      relationship: hebrew_letter
      according_to: marelli
  - tradition: marseille
    display_name: Le Pendu
    denotation: A man hangs by one foot from a gibbet resting upon two trees, each bearing six lopped
      branches. His hands are tied behind his back, his arms folded to form the base of a reversed triangle
      of which his head is the point. His eyes are open, his fair hair floats loose, and his right leg
      crosses his left to form a cross.
    properties:
    - key: number
      value: '12'
    interpretants:
    - type: concept
      value: gibbet
    - type: concept
      value: lopped trees
    - type: concept
      value: reversed triangle
    - type: concept
      value: bound hands
    cites: Papus, Le Tarot des Bohémiens, The Hanged Man
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Lamed
      relationship: hebrew_letter
      according_to: marelli
