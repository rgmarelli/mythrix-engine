semiotic_system: tarot
sign:
  name: Judgement
  type: major-arcana
  manifestations:
  - tradition: rider-waite
    display_name: Judgement
    denotation: A great angel, encompassed by clouds, blows a bannered trumpet marked with a cross. The
      dead rise from their open tombs below — a woman, a man, and between them their child — all in an
      attitude of wonder, adoration, and ecstasy.
    properties:
    - key: number
      value: '20'
    interpretants:
    - type: concept
      value: trumpet
    - type: concept
      value: winged angel
    - type: concept
      value: rising dead
    - type: concept
      value: open tombs
    cites: 'Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, XX. The Last Judgement'
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Resh
      relationship: hebrew_letter
      according_to: marelli
  - tradition: marseille
    display_name: Le Jugement
    denotation: An angel with fiery wings, surrounded by a radiant halo, sounds the trumpet of the last
      judgment, the instrument decorated with a cross. A tomb opens in the earth, and a man, a woman,
      and a child issue from it, their hands joined in a sign of adoration.
    properties:
    - key: number
      value: '20'
    interpretants:
    - type: concept
      value: fiery wings
    - type: concept
      value: trumpet
    - type: concept
      value: tomb
    - type: concept
      value: adoration
    cites: Papus, Le Tarot des Bohémiens, The Judgment
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Resh
      relationship: hebrew_letter
      according_to: marelli
