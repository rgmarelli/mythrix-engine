semiotic_system: tarot
sign:
  name: The Empress
  type: major-arcana
  manifestations:
  - tradition: rider-waite
    display_name: The Empress
    denotation: A stately, seated woman wears a diadem of twelve stars and rich royal vestments. A shield
      bearing the symbol of Venus rests near her. A field of ripening corn stretches out before her, with
      a fall of water beyond it, and she bears a sceptre surmounted by the globe of the world.
    properties:
    - key: number
      value: '3'
    interpretants:
    - type: concept
      value: crown of twelve stars
    - type: concept
      value: Venus shield
    - type: concept
      value: ripening corn
    - type: concept
      value: sceptre
    cites: 'Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, III. The Empress'
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Gimel
      relationship: hebrew_letter
      according_to: marelli
  - tradition: marseille
    display_name: L'Impératrice
    denotation: A woman is seen full face, winged or set in the centre of a radiating sun. She holds an
      eagle in her right hand and, in her left, a sceptre forming the astrological sign of Venus. She
      wears a crown with twelve points, or twelve stars.
    properties:
    - key: number
      value: '3'
    interpretants:
    - type: concept
      value: eagle
    - type: concept
      value: sceptre
    - type: concept
      value: venus sign
    - type: concept
      value: twelve stars
    - type: concept
      value: radiating sun
    cites: Papus, Le Tarot des Bohémiens, The Empress
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Gimel
      relationship: hebrew_letter
      according_to: marelli
