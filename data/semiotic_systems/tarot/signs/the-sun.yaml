semiotic_system: tarot
sign:
  name: The Sun
  type: major-arcana
  manifestations:
  - tradition: rider-waite
    display_name: The Sun
    denotation: A naked child, mounted on a white horse, displays a great red standard beneath a radiant
      sun — the transit from the manifest light of this world to the light of the world to come, typified
      by the heart of a child.
    properties:
    - key: number
      value: '19'
    interpretants:
    - type: concept
      value: naked
    - type: concept
      value: child
    - type: concept
      value: white horse
    - type: concept
      value: red standard
    - type: concept
      value: radiant sun
    cites: 'Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, XIX. The Sun'
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Qoph
      relationship: hebrew_letter
      according_to: marelli
  - tradition: marseille
    display_name: Le Soleil
    denotation: Two naked children are shut into a walled enclosure. The sun sends down its rays upon
      them, and drops of gold escape from it and fall to the ground.
    properties:
    - key: number
      value: '19'
    interpretants:
    - type: concept
      value: naked children
    - type: concept
      value: walled enclosure
    - type: concept
      value: drops of gold
    cites: Papus, Le Tarot des Bohémiens, The Sun
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Qoph
      relationship: hebrew_letter
      according_to: marelli
