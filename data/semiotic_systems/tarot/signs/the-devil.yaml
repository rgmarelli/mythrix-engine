semiotic_system: tarot
sign:
  name: The Devil
  type: major-arcana
  manifestations:
  - tradition: rider-waite
    display_name: The Devil
    denotation: A horned, bat-winged goat-figure — the sign of Mercury at its stomach and a reversed pentagram
      on its forehead — stands on an altar, right hand upraised and a great flaming torch inverted in
      its left. A man and a woman, tailed to signify the animal nature, stand chained by the neck to the
      altar below.
    properties:
    - key: number
      value: '15'
    interpretants:
    - type: concept
      value: horned figure
    - type: concept
      value: bat wings
    - type: concept
      value: inverted torch
    - type: concept
      value: chained figures
    cites: 'Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, XV. The Devil'
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Samekh
      relationship: hebrew_letter
      according_to: marelli
  - tradition: marseille
    display_name: Le Diable
    denotation: The Devil raises his right hand into the air while his left points to the earth, holding
      a lighted torch in place of the Juggler's wand. Two six-pointed horns rise from his head, and he
      stands upon a cube placed upon a sphere. Two smaller chained figures stand beside him.
    properties:
    - key: number
      value: '15'
    interpretants:
    - type: concept
      value: torch
    - type: concept
      value: horns
    - type: concept
      value: cube
    - type: concept
      value: sphere
    - type: concept
      value: chained figures
    cites: Papus, Le Tarot des Bohémiens, The Devil
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Samekh
      relationship: hebrew_letter
      according_to: marelli
