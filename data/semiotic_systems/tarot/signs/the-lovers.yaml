semiotic_system: tarot
sign:
  name: The Lovers
  type: major-arcana
  manifestations:
  - tradition: rider-waite
    display_name: The Lovers
    denotation: The sun shines at the zenith while a great winged figure above pours down influence upon
      a man and woman standing unveiled before each other, as Adam and Eve in the earthly paradise. Behind
      the man stands the Tree of Life bearing twelve fruits; behind the woman, the Tree of the Knowledge
      of Good and Evil, with a serpent twining round it.
    properties:
    - key: number
      value: '6'
    interpretants:
    - type: concept
      value: winged figure
    - type: concept
      value: sun at zenith
    - type: concept
      value: Tree of Life
    - type: concept
      value: serpent
    cites: 'Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, VI. The Lovers'
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Vav
      relationship: hebrew_letter
      according_to: marelli
  - tradition: marseille
    display_name: L'Amoureux
    denotation: A beardless youth stands motionless where two roads meet, his arms crossed upon his breast.
      Two women, one on each side, lay a hand on his shoulder — one crowned with a circle of gold, the
      other dishevelled and crowned with vine leaves. Above them, in a radiant halo, the spirit of Justice
      bends a bow and aims an arrow down at the figure representing Vice.
    properties:
    - key: number
      value: '6'
    interpretants:
    - type: concept
      value: crossroads
    - type: concept
      value: crossed arms
    - type: concept
      value: vine leaves
    - type: concept
      value: radiant halo
    - type: concept
      value: bow
    cites: Papus, Le Tarot des Bohémiens, The Lovers
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Vav
      relationship: hebrew_letter
      according_to: marelli
