semiotic_system: tarot
sign:
  name: Justice
  type: major-arcana
  manifestations:
  - tradition: rider-waite
    display_name: Justice
    denotation: A crowned figure sits enthroned between two pillars, as the High Priestess is seated,
      holding an upright sword in one hand and a balanced pair of scales in the other — the moral principle
      that deals to every man according to his works.
    properties:
    - key: number
      value: '11'
    interpretants:
    - type: concept
      value: scales
    - type: concept
      value: upright sword
    - type: concept
      value: pillars
    cites: 'Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, XI. Justice'
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Cheth
      relationship: hebrew_letter
      according_to: marelli
  - tradition: marseille
    display_name: La Justice
    denotation: A woman is seen full face, wearing an iron coronet and seated upon a throne between two
      columns, the solar cross traced upon her breast. She holds a sword, point upwards, in her right
      hand, and a balance in her left.
    properties:
    - key: number
      value: '8'
    interpretants:
    - type: concept
      value: iron coronet
    - type: concept
      value: solar cross
    - type: concept
      value: sword
    - type: concept
      value: balance
    - type: concept
      value: columns
    cites: Papus, Le Tarot des Bohémiens, Justice
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Cheth
      relationship: hebrew_letter
      according_to: marelli
