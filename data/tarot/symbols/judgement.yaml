symbol:
  name: "Judgement"
  type: major-arcana

interpretations:
  - tradition: rider-waite
    display_name: "Judgement"
    summary: >
      A great angel, encompassed by clouds, blows a bannered trumpet marked
      with a cross. The dead rise from their open tombs below — a woman, a
      man, and between them their child — all in an attitude of wonder,
      adoration, and ecstasy.
    keywords: [trumpet, winged angel, rising dead, open tombs]
    cites: "Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, XX. The Last Judgement"
    attributes:
      - key: number
        value: "20"
        value_type: integer
        retrievable: false
    corresponds_to:
      - to: "Resh"
        relationship: hebrew_letter
        according_to: "marelli"

  - tradition: marseille
    display_name: "Le Jugement"
    summary: >
      An angel with fiery wings, surrounded by a radiant halo, sounds the
      trumpet of the last judgment, the instrument decorated with a cross.
      A tomb opens in the earth, and a man, a woman, and a child issue
      from it, their hands joined in a sign of adoration.
    keywords: [fiery wings, trumpet, tomb, adoration]
    cites: "Papus, Le Tarot des Bohémiens, The Judgment"
    attributes:
      - key: number
        value: "20"
        value_type: integer
        retrievable: false
    corresponds_to:
      - to: "Resh"
        relationship: hebrew_letter
        according_to: "marelli"
