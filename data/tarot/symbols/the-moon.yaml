symbol:
  name: "The Moon"
  type: major-arcana

interpretations:
  - tradition: rider-waite
    display_name: "The Moon"
    summary: >
      A moon with sixteen chief and sixteen secondary rays shines over a
      path that runs between two towers and on toward the unknown. A dog and
      a wolf howl below it, and a crustacean crawls up from the water toward
      the land — the fears of the natural mind guided only by reflected
      light.
    keywords: [two towers, dog and wolf, crustacean, winding path]
    cites: "Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, XVIII. The Moon"
    attributes:
      - key: number
        value: "18"
        value_type: integer
        retrievable: false
    corresponds_to:
      - to: "Tzaddi"
        relationship: hebrew_letter
        according_to: "marelli"

  - tradition: marseille
    display_name: "La Lune"
    summary: >
      A meadow, feebly lit by the moon, is bounded by a tower on each
      side; drops of blood fall from the moon along a path that loses
      itself in the horizon. In the centre of the field a dog and a wolf
      howl at the moon, while a crayfish climbs out of the water between
      them.
    keywords: [towers, dog, wolf, crayfish, drops of blood]
    cites: "Papus, Le Tarot des Bohémiens, The Moon"
    attributes:
      - key: number
        value: "18"
        value_type: integer
        retrievable: false
    corresponds_to:
      - to: "Tzaddi"
        relationship: hebrew_letter
        according_to: "marelli"
