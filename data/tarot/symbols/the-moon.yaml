symbol:
  name: "The Moon"
  type: major-arcana

interpretations:
  - tradition: rider-waite
    display_name: "The Moon"
    summary: >
      A moon with sixteen chief and sixteen secondary rays shines over a
      path that runs between two towers and on toward the unknown. A dog and
      a wolf howl below it, and a crustacean crawls up from the water toward
      the land — the fears of the natural mind guided only by reflected
      light.
    keywords: [two towers, dog and wolf, crustacean, winding path]
    cites: "Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, XVIII. The Moon"
    attributes:
      - key: number
        value: "18"
        value_type: integer
        retrievable: false
    corresponds_to:
      - to: "Tzaddi"
        relationship: hebrew_letter
        according_to: "marelli"
