symbol:
  name: "The World"
  type: major-arcana

interpretations:
  - tradition: rider-waite
    display_name: "The World"
    summary: >
      A dancing female figure, lightly draped in a scarf and holding a wand
      in each hand, stands within a great elliptic garland of flowers. The
      four Living Creatures of Ezekiel's vision, attributed to the
      evangelists, are grouped about the garland's corners — the perfection
      and end of the Cosmos.
    keywords: [dancing figure, oval garland, two wands, four living creatures]
    cites: "Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, XXI. The World"
    attributes:
      - key: number
        value: "21"
        value_type: integer
        retrievable: false
    corresponds_to:
      - to: "Shin"
        relationship: hebrew_letter
        according_to: "marelli"
