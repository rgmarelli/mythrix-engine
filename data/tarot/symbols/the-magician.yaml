symbol:
  name: "The Magician"
  type: major-arcana

interpretations:
  - tradition: rider-waite
    display_name: "The Magician"
    summary: >
      A youthful figure in a magician's robe stands before an altar-like
      table bearing the four suit symbols. A lemniscate hovers above his
      head and a serpent-cincture, devouring its own tail, encircles his
      waist. His right hand raises a wand toward heaven while his left hand
      points to the earth. Roses and lilies grow around his feet.
    keywords: [lemniscate, ouroboros, pointing heaven, pointing earth, altar, wand, sword, cup, pentacle]
    cites: "Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, I. The Magician"
    attributes:
      - key: number
        value: "1"
        value_type: integer
        retrievable: false
    corresponds_to:
      - to: "Aleph"
        relationship: hebrew_letter
        according_to: "marelli"

  - tradition: marseille
    display_name: "Le Bateleur"
    summary: >
      A juggler stands behind a table bearing the cup, the sword, and the
      pentacles, one hand raised toward heaven holding a wand and the other
      pointed down toward the earth. Above his head hovers the sign of
      Universal Life, the figure-eight lemniscate.
    keywords: [juggler, table, cup, sword, pentacles, wand, lemniscate]
    cites: "Papus, Le Tarot des Bohémiens, The Juggler"
    attributes:
      - key: number
        value: "1"
        value_type: integer
        retrievable: false
    corresponds_to:
      - to: "Aleph"
        relationship: hebrew_letter
        according_to: "marelli"
