symbol:
  name: "Temperance"
  type: major-arcana

interpretations:
  - tradition: rider-waite
    display_name: "Temperance"
    summary: >
      A winged angel, bearing the sign of the sun on its forehead and the
      square and triangle of the septenary on its breast, pours the essences
      of life from one chalice to another. One foot rests on the earth and
      the other upon water, and a path climbs toward distant heights where a
      crown glimmers in a great light.
    keywords: [winged angel, two chalices, one foot on water, distant crown]
    cites: "Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, XIV. Temperance"
    attributes:
      - key: number
        value: "14"
        value_type: integer
        retrievable: false
    corresponds_to:
      - to: "Nun"
        relationship: hebrew_letter
        according_to: "marelli"

  - tradition: marseille
    display_name: "Tempérance"
    summary: >
      The genius of the Sun pours the fluid of Life from a golden vase
      into a silver one, the essence passing from one vase to the other
      without a single drop being spilt.
    keywords: [golden vase, silver vase, pouring]
    cites: "Papus, Le Tarot des Bohémiens, Temperance"
    attributes:
      - key: number
        value: "14"
        value_type: integer
        retrievable: false
    corresponds_to:
      - to: "Nun"
        relationship: hebrew_letter
        according_to: "marelli"
