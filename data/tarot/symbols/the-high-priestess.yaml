symbol:
  name: "The High Priestess"
  type: major-arcana

interpretations:
  - tradition: rider-waite
    display_name: "The High Priestess"
    summary: >
      A seated woman is enthroned between a black pillar marked B and a white
      pillar marked J, a veil embroidered with palms and pomegranates hanging
      behind her. A lunar crescent rests at her feet, a horned diadem with a
      globe crowns her head, and a solar cross lies on her breast. She holds
      a partly-veiled scroll inscribed TORA.
    keywords: [black and white pillars, veiled scroll, lunar crescent, horned diadem]
    cites: "Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, II. The High Priestess"
    attributes:
      - key: number
        value: "2"
        value_type: integer
        retrievable: false
    corresponds_to:
      - to: "Beth"
        relationship: hebrew_letter
        according_to: "marelli"

  - tradition: marseille
    display_name: "La Papesse"
    summary: >
      A seated woman is placed under the porch of the temple of Isis,
      between two columns. She wears a tiara surmounted by the lunar
      crescent and is enveloped in a transparent veil falling over her
      face. The solar cross lies on her breast, and an open book, half
      covered by her mantle, rests upon her knees.
    keywords: [tiara, lunar crescent, veil, solar cross, open book, columns]
    cites: "Papus, Le Tarot des Bohémiens, The High Priestess"
    attributes:
      - key: number
        value: "2"
        value_type: integer
        retrievable: false
    corresponds_to:
      - to: "Beth"
        relationship: hebrew_letter
        according_to: "marelli"
