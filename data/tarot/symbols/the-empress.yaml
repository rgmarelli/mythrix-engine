symbol:
  name: "The Empress"
  type: major-arcana

interpretations:
  - tradition: rider-waite
    display_name: "The Empress"
    summary: >
      A stately, seated woman wears a diadem of twelve stars and rich royal
      vestments. A shield bearing the symbol of Venus rests near her. A field
      of ripening corn stretches out before her, with a fall of water beyond
      it, and she bears a sceptre surmounted by the globe of the world.
    keywords: [crown of twelve stars, Venus shield, ripening corn, sceptre]
    cites: "Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, III. The Empress"
    attributes:
      - key: number
        value: "3"
        value_type: integer
        retrievable: false
    corresponds_to:
      - to: "Gimel"
        relationship: hebrew_letter
        according_to: "marelli"

  - tradition: marseille
    display_name: "L'Impératrice"
    summary: >
      A woman is seen full face, winged or set in the centre of a
      radiating sun. She holds an eagle in her right hand and, in her
      left, a sceptre forming the astrological sign of Venus. She wears a
      crown with twelve points, or twelve stars.
    keywords: [eagle, sceptre, venus sign, twelve stars, radiating sun]
    cites: "Papus, Le Tarot des Bohémiens, The Empress"
    attributes:
      - key: number
        value: "3"
        value_type: integer
        retrievable: false
    corresponds_to:
      - to: "Gimel"
        relationship: hebrew_letter
        according_to: "marelli"
