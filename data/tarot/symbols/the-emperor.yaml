symbol:
  name: "The Emperor"
  type: major-arcana

interpretations:
  - tradition: rider-waite
    display_name: "The Emperor"
    summary: >
      A crowned monarch sits commandingly on a throne whose arms are fronted
      by rams' heads. He holds a form of the Crux ansata as a sceptre in one
      hand and a globe in the other, embodying executive power and the
      realization of worldly rule.
    keywords: [rams'-head throne, ankh sceptre, globe, crown]
    cites: "Waite, Pictorial Key to the Tarot, Part II: The Doctrine Behind the Veil, IV. The Emperor"
    attributes:
      - key: number
        value: "4"
        value_type: integer
        retrievable: false
    corresponds_to:
      - to: "Daleth"
        relationship: hebrew_letter
        according_to: "marelli"

  - tradition: marseille
    display_name: "L'Empereur"
    summary: >
      A bearded man sits in profile, holding a sceptre in his right hand.
      He wears a helmet with twelve points and is seated upon a cubic
      stone bearing the figure of an eagle, his legs crossed so his body
      forms a triangle.
    keywords: [sceptre, helmet, cubic stone, eagle, crossed legs, profile]
    cites: "Papus, Le Tarot des Bohémiens, The Emperor"
    attributes:
      - key: number
        value: "4"
        value_type: integer
        retrievable: false
    corresponds_to:
      - to: "Daleth"
        relationship: hebrew_letter
        according_to: "marelli"
