# Rebuilt from sacred-texts.com's own per-chapter HTML (fetched via the
# Wayback Machine, since the live site blocks automated fetches - same
# constraint as before) rather than from a flattened plain-text scrape. The
# book is one HTML page per chapter (sta04.htm-sta50.htm; sta00-sta03 are
# title page/Preface/Table of Contents/Introduction, excluded as front
# matter, same policy as before).
#
# Rather than matching literal chapter/subsection title text (fragile - a
# 47-way and a 102-way alternation of exact prose, one typo or leaked-in
# nav artifact away from silently breaking), the extraction step itself
# writes an explicit, unambiguous marker into the text ahead of every
# chapter's <h1> title ("CHAPTER 1.\n<title>") and every subsection's <h3>
# heading ("SECTION 1.\n<title>", numbered sequentially across the whole
# book, not restarting per chapter). chapter_pattern/subsection_pattern
# then only need to recognize the marker shape, not the title's own
# wording - the title text itself still flows into the paragraph and so
# still becomes part of locator/section exactly as before. Because each
# page carries exactly one real chapter heading, there is no
# table-of-contents collision to work around here (unlike the old
# plain-text pipeline), so body_start_occurrence/body_end_occurrence are
# no longer needed.
#
# Plate images (<img> + "Click to enlarge") are rendered as their own
# segment: a literal "[Illustration omitted]" line followed by the plate's
# title and "From <source>." attribution, when present - so a reader (or a
# retrieval hit) can tell the segment names an image rather than describing
# missing content unexplained. Several plates interrupt a sentence
# mid-paragraph in the source's own page layout (a full-page plate bound
# between two halves of a paragraph in the 1928 print edition, preserved
# verbatim by the modern transcription); those sentence fragments are left
# split rather than guessed back together, but the plate marker itself is
# relocated to sit after the next real paragraph instead of between the
# fragments, so at least the two halves of an interrupted sentence end up
# adjacent to each other. Data tables (e.g. the Hebrew/Greek/Samaritan
# alphabet correspondence chart, the Pythagorean number-letter grid) are
# rendered as one row per line ("|"-joined cells) instead of one bare cell
# per paragraph, which is what the old plain-text scrape produced.

source:
  id: "en_secretteachings"
  domain: symbolism
  citation_label: "Secret Teachings"
  structure:
    scheme: chapter_section
    chapter_pattern: "CHAPTER \\d+\\.\\n.+"
    subsection_pattern: "SECTION \\d+\\.\\n.+"
  title: "The Secret Teachings of All Ages: An Encyclopedic Outline of Masonic, Hermetic, Qabbalistic and Rosicrucian Symbolical Philosophy"
  author: "Manly P. Hall"
  publication_year: 1928
  license: "public-domain"
  uri: "https://www.sacred-texts.com/eso/sta/index.htm"
  description: >
    Hall's encyclopedic survey of esoteric symbolism across Hermeticism,
    Kabbalah, alchemy, Pythagorean number-symbolism, Rosicrucianism, and
    Freemasonry. Copyright was never renewed at the US Copyright Office, so
    the 1928 first edition is public domain; sourced from sacred-texts.com
    (proofread against the original scans, 2001-2004) via the Wayback
    Machine, since the live site blocks automated fetches. Ingested as an
    independent primary-source corpus, not as an interpretive tradition of
    any symbol system.
