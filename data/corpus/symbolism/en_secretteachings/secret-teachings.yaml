# Validated via `mythrix load-documents --dry-run` (T9): detects exactly the
# 47 real chapters (46 numbered chapters + Conclusion). A generic Title-Case
# heuristic (the draft's approach) turned out unworkable — this book's plain
# text has no structural distinction left between a real chapter heading and
# an illustration caption or plate title (e.g. "THE SACRED BULL, OR APIS.",
# "Click to enlarge"), since both are short standalone paragraphs and captions
# are not reliably lowercase or uppercase. chapter_pattern is instead a
# literal alternation of this book's own 47 real chapter/section titles
# (extracted directly from each source page's own <h1>, before HTML-to-text
# conversion discarded that distinction) — exact-match, not a heuristic, so
# it cannot collide with caption text at all. For the same reason,
# subsection_pattern is dropped for this source: the ALL-CAPS topic
# subheadings (e.g. "ANIMALS") are not reliably distinguishable from ALL-CAPS
# plate captions by pattern alone, and getting this source's chapters right
# already required exact titles rather than a generic rule — segments are
# chapter-level only. Preface/Introduction are intentionally excluded (as
# with Golden Bough's own Preface), consistent with front matter being
# excluded by construction; body_start_occurrence skips a single spurious
# early match — this book's own "Ceremonial Magic and Sorcery" chapter title
# happens to render in ALL CAPS in the source HTML too, so it also matches
# its own table-of-contents listing once before its real occurrence.

source:
  id: "en_secretteachings"
  domain: symbolism
  citation_label: "Secret Teachings"
  structure:
    scheme: chapter_section
    chapter_pattern: "The Ancient Mysteries and Secret Societies|The Ancient Mysteries and Secret Societies|The Ancient Mysteries and Secret Societies|Atlantis and the Gods of Antiquity|The Life and Teachings of Thoth Hermes Trismegistus|The Initiation of the Pyramid|Isis, the Virgin of the World|The Sun, A Universal Deity|The Zodiac and Its Signs|The Bembine Table of Isis|Wonders of Antiquity|The Life and Philosophy of Pythagoras|Pythagorean Mathematics|The Human Body in Symbolism|The Hiramic Legend|The Pythagorean Theory of Music and Color|Fishes, Insects, Animals, Reptiles and Birds|Fishes, Insects, Animals, Reptiles and Birds|Flowers, Plants, Fruits, and Trees|Stones, Metals and Gems|CEREMONIAL MAGIC AND SORCERY|The Elements and Their Inhabitants|Hermetic Pharmacology, Chemistry, and Therapeutics|The Qabbalah, the Secret Doctrine of Israel|Fundamentals of Qabbalistic Cosmogony|The Tree of the Sephiroth|Qabbalistic Keys to the Creation of Man|An Analysis of Tarot Cards|The Tabernacle in the Wilderness|The Fraternity of the Rose Cross|Rosicrucian Doctrines and Tenets|Fifteen Rosicrucian and Qabbalistic Diagrams|Alchemy and Its Exponents|The Theory and Practice of Alchemy|The Theory and Practice of Alchemy|THE HERMETIC AND ALCHEMICAL FIGURES OF CLAUDIUS DE DOMINICO CELENTANO VALLIS NOVI FROM A MANUSCRIPT WRITTEN AND ILLUMINATED AT NAPLES A\\.D\\. 1606|The Chemical Marriage|Bacon, Shakspere, and the Rosicrucians|The Cryptogram as a factor in Symbolic Philosophy|Freemasonic Symbolism|Mystic Christianity|The Cross and the Crucifixion|The Mystery of the Apocalypse|The Faith of Islam|American Indian Symbolism|The Mysteries and Their Emissaries|Conclusion"
    body_start_occurrence: 2
  title: "The Secret Teachings of All Ages: An Encyclopedic Outline of Masonic, Hermetic, Qabbalistic and Rosicrucian Symbolical Philosophy"
  author: "Manly P. Hall"
  publication_year: 1928
  license: "public-domain"
  uri: "https://www.sacred-texts.com/eso/sta/index.htm"
  description: >
    Hall's encyclopedic survey of esoteric symbolism across Hermeticism,
    Kabbalah, alchemy, Pythagorean number-symbolism, Rosicrucianism, and
    Freemasonry. Copyright was never renewed at the US Copyright Office, so
    the 1928 first edition is public domain; sourced from sacred-texts.com
    (proofread against the original scans, 2001-2004) via the Wayback
    Machine, since the live site blocks automated fetches. Ingested as an
    independent primary-source corpus, not as an interpretive tradition of
    any symbol system.
