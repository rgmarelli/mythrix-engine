[project]
name = "mythrix"
version = "0.1.0"
description = "Explainable symbolic interpretation engine grounded in structured data and cited primary sources."
readme = "../README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "chromadb==1.5.9",
    "fastapi==0.139.2",
    "kuzu==0.11.3",
    "langchain==1.3.14",
    "langchain-chroma==1.1.0",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.9",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pyyaml==6.0.3",
    "typer==0.27.0",
    "uvicorn==0.51.0",
]

[project.scripts]
mythrix = "mythrix.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mythrix"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_ollama: marks tests that need a running local Ollama daemon",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/mythrix/api/*.py" = ["B008"]  # FastAPI's Depends() is required in argument defaults

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
