semiotic_system: tarot
sign:
  name: The Fool
  type: major-arcana
  manifestations:
  - tradition: rider-waite
    display_name: The Fool
    denotation: A man dressed in ragged, colorful jester-like clothes with small bells walks briskly across
      a rocky ground. He holds a walking stick in his right hand and carries a stick with a small pouch
      slung over his left shoulder. A quadruped animal resembling a small dog or cat tears at his trousers
      from behind, pulling them down to expose the flesh of his thigh and backside. He looks forward and
      slightly upward while walking, ignoring the animal entirely, and the space at the very top of the
      card contains no number.
    interpretants:
    - type: concept
      value: dog
    - type: concept
      value: white rose
    - type: concept
      value: cliff
    cites: Waite, Pictorial Key to the Tarot, p. 97
    intersemiotic_interpretants:
    - target_system: hebrew_alef_bet
      target_sign: Samekh
      relationship: hebrew_letter
      according_to: Golden Dawn
