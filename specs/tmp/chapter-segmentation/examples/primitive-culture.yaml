  domain: symbolism
  citation_label: "Primitive Culture"
  structure:
    scheme: chapter_section
    chapter_pattern: "\\s+CHAPTER [IVXLC]+\\.\\n\\s*[A-Z0-9 ,.'\\-]+\\.?"
  title: "Primitive Culture: Researches into the Development of Mythology, Philosophy, Religion, Language, Art, and Custom"
  author: "Edward B. Tylor"
  publication_year: 1871
  license: "public-domain"
  uri: "https://www.gutenberg.org/ebooks/70458"
  description: >
    Tylor's foundational work of anthropology, establishing the concept of
