# DRAFT — illustrates the chapter_section structure block from plan.md.
# Not loadable yet: sign_schema.StructureBlock only has `scheme` today.
# chapter_pattern spans two lines within one paragraph ("CHAPTER I." then an
# all-capitals title on the next line). The table of contents repeats the
# same wording but flush-left, while real body headings are indented/
# centered — the leading "\s*" below is what excludes the ToC copies, so
# (unlike From Ritual to Romance) no body_start/end_occurrence is needed.

source:
