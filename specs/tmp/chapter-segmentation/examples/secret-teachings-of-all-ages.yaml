# DRAFT — illustrates the chapter_section structure block from plan.md.
# Not loadable yet: sign_schema.StructureBlock only has `scheme` today.
# chapter_pattern (Title Case, no digits/periods) and subsection_pattern
# (ALL CAPS) are both unvalidated heuristics — need checking against a
# false-positive count the way Golden Bough's was, before this is final.
# Open decision (unresolved, see plan.md): as written, the Preface and
# Introduction never match chapter_pattern, so they are silently excluded
# from segmentation. To include them as their own chapters, chapter_pattern
# would need an explicit alternation, e.g. "(PREFACE|INTRODUCTION|<the
# Title Case branch below>)".

source:
  id: "en_secretteachings"
  domain: symbolism
  citation_label: "Secret Teachings"
  structure:
    scheme: chapter_section
    chapter_pattern: "[A-Z][A-Za-z][A-Za-z ,'\\-]{2,80}"
    subsection_pattern: "[A-Z][A-Z ,]{2,60}"
  title: "The Secret Teachings of All Ages: An Encyclopedic Outline of Masonic, Hermetic, Qabbalistic and Rosicrucian Symbolical Philosophy"
  author: "Manly P. Hall"
  publication_year: 1928
  license: "public-domain"
  uri: "https://www.sacred-texts.com/eso/sta/index.htm"
  description: >
    Hall's encyclopedic survey of esoteric symbolism across Hermeticism,
    Kabbalah, alchemy, Pythagorean number-symbolism, Rosicrucianism, and
    Freemasonry. Copyright was never renewed at the US Copyright Office, so
    the 1928 first edition is public domain; sourced from sacred-texts.com
    (proofread against the original scans, 2001-2004) via the Wayback
    Machine, since the live site blocks automated fetches. Ingested as an
    independent primary-source corpus, not as an interpretive tradition of
    any symbol system.
