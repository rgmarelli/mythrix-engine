name: Web

on:
  pull_request:

jobs:
  lint-and-test:
    name: Oxlint & Vitest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Oxlint
        run: npm run lint

      - name: Vitest
        run: npm test

